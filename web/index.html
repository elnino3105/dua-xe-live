<title>Đua Xe LIVE</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700;800&display=swap">
<style>
/* Sân khấu cố định 1080×1920 (khổ dọc TikTok), co giãn theo cửa sổ. Ba tầng: bảng trên, đường đua giữa, thành tích dưới. */
:root {
  --bg: #0b0e17; --panel: #131827; --line: #262d44;
  --ink: #f3f5fb; --dim: #8e98b5; --hot: #ffd23f; --go: #3ee08f; --warn: #ff4d5e; --ice: #6fd6ff;
  --font: "Barlow Condensed", "Arial Narrow", Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; background: #000; overflow: hidden; }
body { font-family: var(--font); color: var(--ink); }
#stage { position: absolute; left: 50%; top: 0; width: 1080px; height: 1920px; transform-origin: 0 0; background: var(--bg); overflow: hidden; }
h2 { margin: 0 0 10px; font-size: 30px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--hot); }

#top { position: absolute; inset: 0 0 auto 0; height: 520px; padding: 24px 28px; display: grid; grid-template-columns: 1fr 330px; gap: 24px; }
#rank { display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: 58px; gap: 8px 14px; align-content: start; }
.row { display: flex; align-items: center; gap: 12px; background: var(--panel); border-radius: 10px; padding: 0 14px; font-size: 32px; font-weight: 700; min-width: 0; border-left: 10px solid var(--c, #888); }
.row .pos { width: 34px; color: var(--dim); font-variant-numeric: tabular-nums; }
.row .nm { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row.fx { box-shadow: inset 0 0 0 3px var(--hot); }
.row.fin .pos { color: var(--go); }
#side { display: flex; flex-direction: column; align-items: center; gap: 8px; }
#mini { width: 300px; height: 300px; }
#lap { font-size: 46px; font-weight: 800; }
#clock { font-size: 40px; font-weight: 700; color: var(--dim); font-variant-numeric: tabular-nums; }
#hint { position: absolute; left: 0; right: 0; top: 452px; height: 68px; display: flex; align-items: center; justify-content: center; font-size: 42px; font-weight: 800; background: var(--hot); color: #14110a; letter-spacing: .02em; }

#mid { position: absolute; left: 0; top: 520px; width: 1080px; height: 820px; }
#view { position: absolute; inset: 0; width: 1080px; height: 820px; display: block; }
#gifts { position: absolute; right: 14px; top: 14px; display: flex; flex-direction: column; gap: 8px; }
.gift { background: rgba(11,14,23,.82); border-radius: 10px; padding: 6px 14px; text-align: right; line-height: 1.05; }
.gift b { display: block; font-size: 30px; font-weight: 800; }
.gift span { font-size: 23px; color: var(--hot); font-weight: 700; }
#feed { position: absolute; left: 14px; bottom: 14px; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; max-width: 760px; }
.msg { background: rgba(11,14,23,.85); border-radius: 10px; padding: 5px 14px; font-size: 30px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.msg.gift, .msg.follow { color: var(--hot); } .msg.win { color: var(--go); } .msg.join { color: var(--ice); }
#banner { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; pointer-events: none; text-shadow: 0 4px 0 rgba(0,0,0,.55), 0 0 30px rgba(0,0,0,.6); }
#big { font-size: 230px; font-weight: 800; line-height: .9; }
#sub { font-size: 54px; font-weight: 800; max-width: 900px; }
#podium { display: flex; flex-direction: column; gap: 10px; font-size: 58px; font-weight: 800; }
#podium div:first-child { font-size: 84px; color: var(--hot); }

#bottom { position: absolute; left: 0; right: 0; top: 1340px; bottom: 0; padding: 24px 28px; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: auto 1fr; gap: 14px 24px; }
#queue { grid-column: 1 / 3; font-size: 30px; font-weight: 700; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tbl div { display: flex; gap: 12px; font-size: 30px; font-weight: 700; padding: 5px 0; border-bottom: 2px solid var(--line); }
.tbl .nm { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tbl .val { color: var(--hot); font-variant-numeric: tabular-nums; }
.tbl .empty { color: var(--dim); border: 0; font-weight: 500; }
#lost { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(0,0,0,.8); font-size: 54px; font-weight: 800; text-align: center; padding: 60px; }
[hidden] { display: none !important; }

:root { color-scheme: dark; }
#demo { display: flex; height: 100%; }
#frame { position: relative; flex: 1; min-width: 0; min-height: 0; overflow: hidden; background: #000; }
#panel { width: 310px; flex: none; overflow: auto; background: var(--panel); color: var(--ink); border-left: 1px solid var(--line);
  padding: 18px 16px; display: flex; flex-direction: column; gap: 14px; font: 15px/1.45 system-ui, "Segoe UI", sans-serif; }
#panel h1 { margin: 0; font: 800 26px var(--font); letter-spacing: .04em; text-transform: uppercase; color: var(--hot); }
#panel p { margin: 0; color: var(--dim); font-size: 13.5px; }
#panel label { display: block; font-size: 13px; color: var(--dim); margin-bottom: 4px; }
#panel .btns { display: flex; flex-wrap: wrap; gap: 8px; }
#panel button { font: 600 14px system-ui, sans-serif; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer; }
#panel button:hover { border-color: var(--hot); }
#panel button:focus-visible, #panel input:focus-visible { outline: 2px solid var(--hot); outline-offset: 2px; }
#panel input[type=text] { font: inherit; width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
#panel .check { display: flex; gap: 8px; align-items: center; color: var(--ink); font-size: 15px; margin: 0; }
@media (max-width: 760px) {
  #demo { flex-direction: column; }
  #panel { width: auto; max-height: 38%; border-left: 0; border-top: 1px solid var(--line); gap: 10px;
    padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  #panel p { display: none; }
}
</style>
<div id="demo">
  <div id="frame"><div id="stage">
  <div id="top">
    <div>
      <h2>Thứ hạng · Vòng đua <span id="round">1</span></h2>
      <div id="rank"></div>
    </div>
    <div id="side">
      <canvas id="mini" width="300" height="300"></canvas>
      <div id="lap">VÒNG 1/2</div>
      <div id="clock">0:00.0</div>
    </div>
    <div id="hint"></div>
  </div>

  <div id="mid">
    <canvas id="view" width="1080" height="820"></canvas>
    <div id="gifts"></div>
    <div id="feed"></div>
    <div id="banner"><div id="big"></div><div id="sub"></div><div id="podium"></div></div>
  </div>

  <div id="bottom">
    <div id="queue"></div>
    <div><h2>Top chiến thắng</h2><div class="tbl" id="wins"></div></div>
    <div><h2>Thời gian tốt nhất</h2><div class="tbl" id="best"></div></div>
  </div>
  <div id="lost" hidden>Mất kết nối với máy chủ game.<br>Hãy chạy lại: node server.js</div>
</div>
  </div>
<aside id="panel">
  <h1>Bản thử trên web</h1>
  <p>Game chạy ngay trong trình duyệt với người xem giả lập. Bản này không kết nối TikTok.</p>
  <label class="check" for="dAuto"><input id="dAuto" type="checkbox" checked> Tự tạo người xem và quà</label>
  <div class="btns">
    <button id="dCrowd" type="button">Thêm 5 người xem</button>
    <button id="dStart" type="button">Xuất phát ngay</button>
  </div>
  <div>
    <label for="dWho">Tên của bạn trong game</label>
    <input id="dWho" type="text" value="ban_choi" maxlength="18">
  </div>
  <div class="btns">
    <button id="dJoin" type="button">Bình luận “1”</button>
    <button id="dLike" type="button">Thả 10 tim</button>
    <button id="dFollow" type="button">Follow</button>
  </div>
  <div>
    <label>Tặng quà cho xe của bạn</label>
    <div class="btns" id="dGifts"></div>
  </div>
</aside>
</div>
<script>
// Luật chơi và trạng thái của game. Chạy được cả trên máy chủ (Node.js) lẫn trong trình duyệt (bản thử trên web).
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.createEngine = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';
    const COLORS = ['#ff4d5e', '#ffb02e', '#ffe14d', '#7be04a', '#27d3a2', '#35c9ff',
      '#4f8dff', '#9b6bff', '#e86bff', '#ff7ac0', '#f2f2f2', '#ff8a3d'];
    const BOT_NAMES = ['Máy Sấm', 'Máy Gió', 'Máy Lửa', 'Máy Mây', 'Máy Sóng', 'Máy Núi',
      'Máy Sao', 'Máy Trăng', 'Máy Mưa', 'Máy Cát', 'Máy Băng', 'Máy Nắng'];


  return function createEngine(cfg, host) {
    host = host || {};
    const stats = host.stats || {};
    const saveStats = () => { if (host.saveStats) host.saveStats(stats); };

    const game = {
      phase: 'lobby', timer: cfg.lobbySeconds, raceTime: 0, round: 1,
      cars: [], queue: [], feed: [], results: [],
      focus: null, focusUntil: 0, feedSeq: 0, endAt: 0
    };

    // ---------- tiện ích ----------
    function cleanName(raw) {
      let s = String(raw == null ? '' : raw).replace(/[\u0000-\u001f<>]/g, '').trim().slice(0, 18);
      const low = s.toLowerCase();
      if (!s || cfg.bannedWords.some(w => low.includes(w))) s = 'Khách ' + Math.floor(100 + Math.random() * 900);
      return s;
    }
    function pushFeed(text, kind) {
      game.feed.push({ n: ++game.feedSeq, text, kind: kind || 'info' });
      if (game.feed.length > 6) game.feed.shift();
    }
    const findCar = id => game.cars.find(c => c.id === id);
    const realCars = () => game.cars.filter(c => !c.bot);

    function makeCar(id, name, bot) {
      const i = game.cars.length;
      return {
        id, name, bot: !!bot, color: COLORS[i % COLORS.length], lane: i % 4,
        dist: -8 - Math.floor(i / 4) * 16, speed: 0, form: 0, formT: 0,
        fx: { turbo: 0, super: 0, rocket: 0, slow: 0 },
        finished: false, time: 0, place: 0, active: true
      };
    }

    function applyEffect(car, effect, count) {
      const def = cfg.effects[effect];
      if (!def || car.finished) return;
      const dur = Math.min(def.seconds * Math.max(1, count), cfg.maxEffectSeconds);
      const add = (c, key, v) => { c.fx[key] = Math.min(c.fx[key] + v, cfg.maxEffectSeconds); };
      if (effect === 'storm') {
        for (const o of game.cars) if (o !== car && !o.finished && o.dist > car.dist) add(o, 'slow', def.seconds);
        add(car, 'super', dur);
      } else add(car, effect, dur);
    }

    // Trả về xe hoặc mục hàng chờ của người xem; tạo mới nếu chưa có.
    function join(id, name) {
      const car = findCar(id);
      if (car) { car.active = true; return { car }; }
      let q = game.queue.find(e => e.id === id);
      if (q) return { queued: q };
      if (game.phase === 'lobby' && realCars().length < cfg.maxCars) {
        const c = makeCar(id, name, false);
        game.cars.push(c);
        pushFeed(name + ' vào đua', 'join');
        return { car: c };
      }
      if (game.queue.length >= 60) return {};
      q = { id, name, pending: [] };
      game.queue.push(q);
      pushFeed(name + ' xếp hàng cho vòng sau', 'join');
      return { queued: q };
    }

    function giftDef(name, coins) {
      const exact = cfg.gifts.find(g => g.name.toLowerCase() === String(name || '').toLowerCase());
      if (exact) return exact;
      let best = null;
      for (const g of cfg.gifts) if (g.coins <= coins && (!best || g.coins > best.coins)) best = g;
      return best || cfg.gifts[0];
    }

    // ---------- sự kiện từ người xem (cầu nối TikTok hoặc giả lập) ----------
    function handleEvent(ev) {
      if (!ev || typeof ev !== 'object') return;
      const id = String(ev.user || ev.name || '').slice(0, 40);
      if (!id) return;
      const name = cleanName(ev.name || ev.user);
      const count = Math.max(1, Math.min(9999, Math.floor(Number(ev.count) || 1)));

      if (ev.type === 'comment') {
        const text = String(ev.text || '').trim().toLowerCase();
        if (text === cfg.joinKeyword.toLowerCase()) join(id, name);
        else { const c = findCar(id); if (c) c.active = true; }
      } else if (ev.type === 'like') {
        const c = findCar(id);
        if (c) {
          c.active = true;
          if (game.phase === 'race' && !c.finished) c.fx.turbo = Math.min(c.fx.turbo + cfg.likeTurboSeconds * count, 2);
        }
      } else if (ev.type === 'follow') {
        const r = join(id, name);
        if (r.car) applyEffect(r.car, 'turbo', 1);
        else if (r.queued) r.queued.pending.push({ effect: 'turbo', count: 1 });
        pushFeed(name + ' đã follow → ' + cfg.effects.turbo.label, 'follow');
      } else if (ev.type === 'gift') {
        const coins = Math.max(0, Number(ev.coins) || 0);
        const g = giftDef(ev.gift, coins);
        const r = join(id, name);
        if (r.car) {
          applyEffect(r.car, g.effect, count);
          if ((coins || g.coins) * count >= cfg.focusMinCoins) { game.focus = r.car.id; game.focusUntil = Date.now() + 4000; }
        } else if (r.queued) r.queued.pending.push({ effect: g.effect, count });
        pushFeed(name + ' tặng ' + (ev.gift || g.name) + (count > 1 ? ' ×' + count : '') + ' → ' + cfg.effects[g.effect].label, 'gift');
      }
    }

    // ---------- vòng lặp game ----------
    function startCountdown() {
      let b = 0;
      while (game.cars.length < cfg.minCars) {
        const used = new Set(game.cars.map(c => c.name));
        const nm = BOT_NAMES.find(n => !used.has(n)) || 'Máy ' + (++b);
        game.cars.push(makeCar('bot:' + nm, nm, true));
      }
      game.phase = 'countdown'; game.timer = 3;
    }

    function ranking() {
      return game.cars.slice().sort((a, b) => {
        if (a.finished && b.finished) return a.place - b.place;
        if (a.finished !== b.finished) return a.finished ? -1 : 1;
        return b.dist - a.dist;
      });
    }

    function endRace() {
      game.results = ranking().slice(0, 3).map(c => ({ name: c.name, color: c.color, time: c.finished ? c.time : null }));
      for (const c of game.cars) {
        if (c.bot || !c.finished) continue;
        const s = stats[c.id] || (stats[c.id] = { name: c.name, wins: 0, best: null });
        s.name = c.name;
        if (c.place === 1) s.wins++;
        if (s.best == null || c.time < s.best) s.best = c.time;
      }
      saveStats();
      const w = game.results[0];
      if (w) pushFeed(w.name + ' thắng vòng ' + game.round, 'win');
      game.phase = 'podium'; game.timer = cfg.podiumSeconds;
    }

    function newLobby() {
      const keep = cfg.keepActivePlayers ? game.cars.filter(c => !c.bot && c.active) : [];
      game.cars = [];
      for (const k of keep) { const c = makeCar(k.id, k.name, false); c.active = false; game.cars.push(c); }
      while (game.queue.length && realCars().length < cfg.maxCars) {
        const q = game.queue.shift();
        const c = makeCar(q.id, q.name, false);
        game.cars.push(c);
        for (const p of q.pending) applyEffect(c, p.effect, p.count);
      }
      game.results = []; game.round++; game.raceTime = 0; game.endAt = 0;
      game.phase = 'lobby'; game.timer = cfg.lobbySeconds;
    }

    function tick(dt) {
      if (game.phase === 'lobby') {
        game.timer -= dt;
        if (game.timer <= 0) startCountdown();
      } else if (game.phase === 'countdown') {
        game.timer -= dt;
        if (game.timer <= 0) { game.phase = 'race'; game.raceTime = 0; }
      } else if (game.phase === 'race') {
        game.raceTime += dt;
        const total = cfg.laps * cfg.lapLength;
        let lead = -Infinity;
        for (const c of game.cars) if (!c.finished && c.dist > lead) lead = c.dist;
        let placed = game.cars.filter(c => c.finished).length;
        for (const c of game.cars) {
          if (c.finished) { c.speed *= 0.97; c.dist += c.speed * dt; continue; }
          c.formT -= dt;
          if (c.formT <= 0) { c.formT = 1.5 + Math.random() * 2; c.formGoal = (Math.random() * 2 - 1) * 0.07; }
          c.form += ((c.formGoal || 0) - c.form) * Math.min(1, dt * 1.5);
          let m = 1;
          for (const k of ['turbo', 'super', 'rocket']) if (c.fx[k] > 0) { m += cfg.effects[k].boost; c.fx[k] = Math.max(0, c.fx[k] - dt); }
          m = Math.min(m, cfg.maxSpeedMult);
          if (c.fx.slow > 0) { m *= 1 - cfg.effects.storm.slow; c.fx.slow = Math.max(0, c.fx.slow - dt); }
          const catchUp = Math.min(cfg.catchUpMax, Math.max(0, lead - c.dist) / cfg.lapLength * 0.4);
          const target = cfg.baseSpeed * (1 + c.form + catchUp) * m;
          c.speed += (target - c.speed) * Math.min(1, dt * 3);
          c.dist += c.speed * dt;
          if (c.dist >= total) { c.finished = true; c.place = ++placed; c.time = Math.round(game.raceTime * 100) / 100; }
        }
        if (placed >= Math.min(3, game.cars.length) && !game.endAt) game.endAt = game.raceTime + 4;
        if (placed === game.cars.length || (game.endAt && game.raceTime >= game.endAt) || game.raceTime >= cfg.maxRaceSeconds) endRace();
      } else if (game.phase === 'podium') {
        for (const c of game.cars) { c.speed *= 0.97; c.dist += c.speed * dt; }
        game.timer -= dt;
        if (game.timer <= 0) newLobby();
      }
    }

    function snapshot() {
      const rank = ranking();
      const list = Object.values(stats);
      return {
        phase: game.phase, timer: Math.max(0, game.timer), raceTime: game.raceTime, round: game.round,
        laps: cfg.laps, lapLength: cfg.lapLength, joinKeyword: cfg.joinKeyword, maxCars: cfg.maxCars,
        cars: rank.map((c, i) => ({
          id: c.id, name: c.name, color: c.color, lane: c.lane, d: Math.round(c.dist * 100) / 100,
          v: Math.round(c.speed * 10) / 10, bot: c.bot, fin: c.finished, time: c.time, rank: i + 1,
          fx: Object.keys(c.fx).filter(k => c.fx[k] > 0)
        })),
        queue: game.queue.slice(0, 6).map(q => q.name), queueLen: game.queue.length,
        feed: game.feed, results: game.results,
        tiktok: host.tiktok ? host.tiktok() : { state: 'off', user: '', message: 'Bản thử trên web không kết nối TikTok' },
        focus: Date.now() < game.focusUntil ? game.focus : null,
        gifts: cfg.gifts.map(g => ({ name: g.name, coins: g.coins, label: cfg.effects[g.effect].label, effect: g.effect })),
        topWins: list.filter(s => s.wins > 0).sort((a, b) => b.wins - a.wins).slice(0, 6).map(s => ({ name: s.name, wins: s.wins })),
        topBest: list.filter(s => s.best != null).sort((a, b) => a.best - b.best).slice(0, 6).map(s => ({ name: s.name, best: s.best }))
      };
    }

    function adminAction(a) {
      if (!a) return;
      if (a.action === 'start' && game.phase === 'lobby') game.timer = 0;
      else if (a.action === 'end' && game.phase === 'race') endRace();
      else if (a.action === 'reset') { game.cars = []; game.queue = []; game.feed = []; game.round = 0; newLobby(); }
      else if (host.admin && host.admin(a)) return;
      else if (a.action === 'kick') {
        game.cars = game.cars.filter(c => c.id !== a.id);
        game.queue = game.queue.filter(q => q.id !== a.id);
      }
    }

    return { handleEvent, tick, snapshot, adminAction };
  };
});

</script>
<script>
(() => {
  const CONFIG = {"joinKeyword":"1","laps":2,"lapLength":1000,"baseSpeed":28,"maxCars":12,"minCars":6,"lobbySeconds":15,"podiumSeconds":10,"maxRaceSeconds":180,"keepActivePlayers":true,"maxSpeedMult":2.8,"maxEffectSeconds":20,"catchUpMax":0.1,"likeTurboSeconds":0.15,"focusMinCoins":10,"effects":{"turbo":{"label":"Tăng tốc","boost":0.4,"seconds":3},"super":{"label":"Siêu tốc","boost":0.8,"seconds":4},"rocket":{"label":"Tên lửa","boost":1.5,"seconds":3},"storm":{"label":"Giông bão","slow":0.4,"seconds":4}},"gifts":[{"name":"Rose","coins":1,"effect":"turbo"},{"name":"Perfume","coins":20,"effect":"super"},{"name":"Doughnut","coins":30,"effect":"rocket"},{"name":"Money Gun","coins":500,"effect":"storm"}],"bannedWords":["địt","lồn","cặc","đụ","fuck","sex"]};
  let stats = {};
  try { stats = JSON.parse(localStorage.getItem('dxl-stats')) || {}; } catch (e) {}
  const engine = createEngine(CONFIG, { stats, saveStats: s => { try { localStorage.setItem('dxl-stats', JSON.stringify(s)); } catch (e) {} } });

  // Màn hình game mở "api/stream"; ở bản thử, luồng đó là engine chạy ngay trong trang.
  window.EventSource = class {
    constructor() {
      let last = performance.now();
      setInterval(() => {
        const now = performance.now(); let left = Math.min(0.25, (now - last) / 1000); last = now;
        while (left > 0) { engine.tick(Math.min(0.05, left)); left -= 0.05; }
        if (this.onmessage) this.onmessage({ data: JSON.stringify(engine.snapshot()) });
      }, 50);
    }
  };

  const $ = id => document.getElementById(id);

  function setLabel(o, c) {

    }

    // camera: bám nhóm đầu, chuyển sang xe vừa nhận quà lớn, quay quanh người thắng lúc trao giải
    const alive = S.cars.filter(c => !c.fin);
    const focus = S.cars.find(c => c.id === S.focus) || alive[Math.min(2, alive.length - 1)] || S.cars[0];
    if (S.phase === 'podium' && S.cars[0]) {
      const w = at(disp.get(S.cars[0].id), LANE[S.cars[0].lane]), a = now / 3500;
      wantPos.set(w.x + Math.cos(a) * 52, 26, w.y + Math.sin(a) * 52); wantLook.set(w.x, 2, w.y);
    } else if (focus) {
      const fd = disp.get(focus.id);
      if (!cam.ready || Math.abs(fd - cam.d) > 400) { cam.d = fd; cam.h = at(fd).h; cam.ready = true; }
      cam.d += (fd - cam.d) * Math.min(1, dt * 3);
      const p = at(cam.d);
      let dh = p.h - cam.h; dh = Math.atan2(Math.sin(dh), Math.cos(dh)); cam.h += dh * Math.min(1, dt * 3.5);
      const dx = Math.cos(cam.h), dz = Math.sin(cam.h);
      wantPos.set(p.x - dx * 40, 21, p.y - dz * 40); wantLook.set(p.x + dx * 24, 2, p.y + dz * 24);
    }
    const snap = camPos.distanceTo(wantPos) > 350 || camPos.lengthSq() === 0, k = snap ? 1 : Math.min(1, dt * 6);
    camPos.lerp(wantPos, k); camLook.lerp(wantLook, k);
    camera.position.copy(camPos); camera.lookAt(camLook);
    renderer.render(scene, camera);

    // bản đồ nhỏ
    mc.clearRect(0, 0, 300, 300); mc.drawImage(miniBase, 0, 0);
    for (let i = S.cars.length - 1; i >= 0; i--) {
      const c = S.cars[i], p = at(disp.get(c.id));
      mc.fillStyle = c.color; mc.strokeStyle = '#0b0e17'; mc.lineWidth = 2;
      mc.beginPath(); mc.arc(p.x * mm.sc + mm.ox, p.y * mm.sc + mm.oy, c.rank === 1 ? 10 : 7, 0, 7); mc.fill(); mc.stroke();
    }
  }
  requestAnimationFrame(frame);
})();
</script>
